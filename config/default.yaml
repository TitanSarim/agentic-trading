# Default config for Windows app host → LAN Ollama.
# Env overrides win: OLLAMA_BASE_URL, TRADER_CONFIG, etc.

provider_url: "http://192.168.8.22:11434"  # alias for ollama.base_url

ollama:
  base_url: "http://192.168.8.22:11434"
  screen_model: "qwen3.5:9b"
  analyst_model: "qwen3.8:27b"
  # alternate_analyst: "qwen3.6:27b"
  temperature: 0.1
  timeout_seconds: 30
  fail_closed_on_error: true
  backend: "ollama"          # ollama | mock (CI: set OLLAMA_BACKEND=mock)
  use_screen_model: false    # optional qwen3.5:9b pre-screen

mt5:
  terminal_path: "C:\\Program Files\\MetaTrader 5 IC Markets Global\\terminal64.exe"
  broker: "IC Markets Global"
  account_mode: "demo"  # flip to live only after Definition of Done

universe:
  symbols: ["EURUSD", "GBPUSD", "USDJPY", "XAUUSD"]
  timeframes: ["M5", "M15"]

risk:
  risk_fraction_per_trade: 0.0035
  max_positions: 1
  daily_loss_lock_pct: 0.015
  weekly_drawdown_lock_pct: 0.045
  consecutive_loss_lock: 3
  allow_llm_increase_risk: false
  # Phase 3 hard gates
  max_data_age_seconds: 120
  max_spread_pips: 3.0
  min_volume: 0.01
  volume_step: 0.01
  max_volume: 1.0
  forbid_averaging_down: true
  forbid_martingale: true
  apply_confidence_haircut: false
  correlation_groups:
    - ["EURUSD", "GBPUSD"]

execution:
  require_attached_stop: true
  idempotent_client_order_ids: true
  allow_live: false  # P6 demo-only; live only after Definition of Done (P9)

# Phase 7 — monitoring / kill switches (operator + auto; no required SaaS)
monitoring:
  api_enabled: true
  api_host: "127.0.0.1"
  api_port: 8787
  heartbeat_stale_seconds: 120
  fail_closed_on_stale: true
  auto_halt_on_risk_lock: true
  alerts_enabled: true
  webhook_url: null  # optional POST JSON; empty = log-only

# Phase 8 — walk-forward / stress / soak (offline validation before tiny live)
validation:
  train_bars: 200
  test_bars: 80
  step_bars: 80
  mode: "rolling"  # rolling | expanding
  min_folds: 2
  min_oos_trades: 1
  require_non_negative_expectancy: false
  max_oos_drawdown: null
  soak_ticks: 40
  soak_bars: 200
  report_dir: "reports"
  default_bars: 400
  scenario: "trend_pullback"
  spread_shock_mult: 5.0
  slippage_shock_pips: 3.0

database:
  path: "data/trader.db"

logging:
  level: "INFO"
  json_logs: false

broker:
  # mock | mt5 — mt5 requires MetaTrader5 Python on Windows next to terminal64.exe
  backend: "mock"
  mode: "demo"  # demo required for P6; refuse live unless allow_live (P9)

# Phase 2 — research strategy + costs (offline backtests only)
strategy:
  name: "trend_pullback_v1"
  ema_fast: 8
  ema_slow: 21
  atr_period: 14
  rsi_period: 14
  swing_lookback: 5
  pullback_atr_frac: 0.6
  stop_atr_mult: 1.5
  risk_reward: 2.0
  min_setup_score: 50.0
  ema_touch_atr_frac: 0.35

costs:
  commission_per_lot: 7.0
  slippage_pips: 0.5
  swap_per_lot_per_day: 0.0

backtest:
  volume: 0.10
  max_hold_bars: 48
  one_position: true
  default_bars: 400
  scenario: "trend_pullback"  # synthetic offline scenario; not live data
  use_risk_engine: true       # size/reject via RiskEngine (P3)
  starting_equity: 1000.0

# Phase 4 — scanner ranks only; RiskEngine still must approve any trade
scanner:
  top_n: 3
  min_bars: 64
  max_data_age_seconds: 300
  max_spread_pips: 3.0
  max_spread_pips_by_symbol:
    XAUUSD: 50.0
  max_gap_frac: 0.01
  correlation_penalty: 12.0
  default_bars: 120
  scenario: "trend_pullback"
  evaluate_strategy: true
  analyze_candidates: false  # optional Qwen/mock after strategy (P5; no orders)
