[project]
name = "agentic-trading"
version = "0.1.0"
description = "Autonomous Qwen + Ollama + MT5 trading system (Phase 6 demo execution)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
mt5 = [
    # Windows only — install on the MT5 host next to terminal64.exe
    "MetaTrader5>=5.0.45; platform_system=='Windows'",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
trader = "apps.trader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "brokers", "trading", "research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]
